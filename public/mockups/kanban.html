<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Me Escuta · Funil</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;450;500;600;700&display=swap');

  :root{
    --laranja:#EC662E; --laranja-esc:#D4541F; --laranja-cl:#FDEEE4; --pessego:#FCE7DB;
    --navy:#252F63; --azul:#143691;
    --creme:#FBF9F6; --bg:#F3EEE6; --branco:#FFFFFF;
    --texto:#3a3a3a; --suave:#6f6c76; --mute:#a3a0a8;
    --borda:#ECE3D6; --borda-2:#E3D9CA;
    --verde:#2E8B62; --verde-bg:#EAF6EF; --verde-bd:#BFE4CF;
    --vermelho:#C4482E; --vermelho-bg:#FBEBE4; --vermelho-bd:#F1CDBF;
    --amarelo:#B8860B; --amarelo-bg:#FBF3DF; --amarelo-bd:#EAD9A6;
    --azul-bg:#EEF1FB; --azul-bd:#D5DDF3;
    --sombra-sm:0 1px 3px rgba(37,47,99,.06);
    --sombra:0 6px 26px rgba(37,47,99,.09);
    --sombra-drag:0 14px 40px rgba(37,47,99,.22);
    font-size:15px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--texto);background:var(--bg);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  .serif{font-family:'Fraunces',Georgia,serif}
  svg{display:block}

  .app{display:flex;flex-direction:column;height:100vh}

  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;height:58px;padding:0 24px;background:var(--branco);border-bottom:1px solid var(--borda);flex-shrink:0}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mk{width:34px;height:34px;border-radius:50%;background:var(--laranja);color:#fff;display:grid;place-items:center;font-size:1.1rem;box-shadow:0 3px 10px rgba(236,102,46,.3)}
  .brand .nm{font-family:'Fraunces',serif;font-weight:600;color:var(--navy);font-size:1.18rem}
  .brand .nm b{color:var(--laranja);font-weight:700}
  .nav{display:flex;gap:4px;margin-left:26px}
  .nav a{font-size:.85rem;font-weight:500;color:var(--suave);text-decoration:none;padding:8px 14px;border-radius:9px;transition:.15s}
  .nav a:hover{background:var(--creme);color:var(--navy)}
  .nav a.on{background:var(--laranja-cl);color:var(--laranja-esc);font-weight:600}
  .topbar .sp{flex:1}
  .userchip{display:flex;align-items:center;gap:10px}
  .userchip .ui{text-align:right;line-height:1.15}
  .userchip .ui .n{font-size:.82rem;font-weight:600;color:var(--navy)}
  .userchip .ui .r{font-size:.68rem;color:var(--mute)}
  .userchip .ua{width:33px;height:33px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:.76rem;font-weight:700}

  /* ---------- funnel toolbar ---------- */
  .tools{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--branco);border-bottom:1px solid var(--borda);flex-shrink:0}
  .tools h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.24rem;color:var(--navy);line-height:1}
  .tools .sub{font-size:.74rem;color:var(--mute);margin-top:2px}
  .search{display:flex;align-items:center;gap:8px;background:var(--creme);border:1.5px solid var(--borda-2);border-radius:11px;padding:8px 13px;width:280px;transition:.15s}
  .search:focus-within{border-color:var(--laranja);background:#fff;box-shadow:0 0 0 3px rgba(236,102,46,.1)}
  .search svg{width:15px;height:15px;stroke:var(--mute);fill:none;flex-shrink:0}
  .search input{border:none;background:none;outline:none;font-family:'Inter',sans-serif;font-size:.86rem;color:var(--texto);width:100%}
  .search input::placeholder{color:var(--mute)}
  .filtro{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:500;color:var(--suave);background:#fff;border:1.5px solid var(--borda-2);border-radius:11px;padding:8px 14px;cursor:pointer;transition:.15s}
  .filtro:hover{border-color:var(--laranja);color:var(--navy)}
  .filtro svg{width:14px;height:14px;stroke:currentColor;fill:none}
  .tools .sp{flex:1}
  .btn-novo{display:inline-flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;font-size:.86rem;font-weight:600;color:#fff;background:var(--laranja);border:none;border-radius:11px;padding:10px 17px;cursor:pointer;box-shadow:0 3px 11px rgba(236,102,46,.26);transition:.15s}
  .btn-novo:hover{background:var(--laranja-esc)}
  .btn-novo svg{width:16px;height:16px;stroke:#fff;fill:none}

  /* ---------- board ---------- */
  .board{flex:1;display:flex;gap:16px;padding:18px 24px 24px;overflow-x:auto;overflow-y:hidden;min-height:0}
  .col{width:288px;flex-shrink:0;display:flex;flex-direction:column;height:100%;min-height:0}
  .col-head{display:flex;align-items:center;gap:9px;padding:2px 4px 12px;flex-shrink:0}
  .col-head .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .col-head .ct{font-weight:600;font-size:.9rem;color:var(--navy)}
  .col-head .cn{font-size:.72rem;font-weight:600;color:var(--suave);background:var(--branco);border:1px solid var(--borda-2);border-radius:20px;padding:2px 9px}
  .col-head .cv{margin-left:auto;font-size:.72rem;color:var(--mute);font-family:ui-monospace,Menlo,monospace}
  .col-head .add{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--mute);cursor:pointer;transition:.15s}
  .col-head .add:hover{background:var(--branco);color:var(--laranja-esc)}
  .col-head .add svg{width:15px;height:15px;stroke:currentColor;fill:none}

  .col-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:11px;padding:4px 4px 40px;border-radius:14px;transition:.15s}
  .col-body.drop{background:var(--laranja-cl);box-shadow:inset 0 0 0 2px #f4c4a8}

  /* ---------- card ---------- */
  .card{background:var(--branco);border:1px solid var(--borda);border-radius:14px;padding:13px 14px 12px;box-shadow:var(--sombra-sm);cursor:grab;position:relative;transition:box-shadow .15s,transform .05s}
  .card:hover{box-shadow:var(--sombra);border-color:var(--borda-2)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4;box-shadow:var(--sombra-drag)}
  .card .stripe{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
  .card .c-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
  .card .c-nome{font-weight:600;font-size:.92rem;color:var(--navy);line-height:1.2;flex:1}
  .card .c-idade{font-size:.7rem;color:var(--mute);font-weight:500}
  .card .c-menu{color:var(--mute);cursor:pointer;padding:2px;margin:-2px -2px 0 0;line-height:0}
  .card .c-menu:hover{color:var(--suave)}
  .card .c-menu svg{width:15px;height:15px;fill:currentColor}

  .c-row{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--suave);margin-bottom:7px}
  .c-row svg{width:13px;height:13px;stroke:var(--mute);fill:none;flex-shrink:0}

  .c-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .origem{font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .origem .oi{width:6px;height:6px;border-radius:50%}
  .origem.wa{background:var(--verde-bg);color:var(--verde)} .origem.wa .oi{background:var(--verde)}
  .origem.ig{background:#FBEDF3;color:#B23A6E} .origem.ig .oi{background:#B23A6E}
  .origem.meta{background:var(--azul-bg);color:var(--azul)} .origem.meta .oi{background:var(--azul)}
  .origem.ind{background:var(--pessego);color:var(--laranja-esc)} .origem.ind .oi{background:var(--laranja)}

  .timer{font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .timer svg{width:11px;height:11px;stroke:currentColor;fill:none}
  .timer.ok{background:var(--verde-bg);color:var(--verde)}
  .timer.warn{background:var(--amarelo-bg);color:var(--amarelo)}
  .timer.late{background:var(--vermelho-bg);color:var(--vermelho)}

  /* proposta pendente (propõe/valida) */
  .prop-pill{display:flex;align-items:center;gap:7px;font-size:.72rem;line-height:1.3;background:var(--azul-bg);border:1px solid var(--azul-bd);color:var(--navy);border-radius:9px;padding:7px 9px;margin-bottom:10px}
  .prop-pill .pi{width:19px;height:19px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:.62rem;font-weight:700;color:#fff}
  .prop-pill .pi.clara{background:linear-gradient(140deg,#F2803F,#EC662E)}
  .prop-pill .pi.lev{background:var(--navy)}
  .prop-pill b{color:var(--laranja-esc);font-weight:700}
  .prop-pill .agente{font-weight:600;color:var(--navy)}

  .c-foot{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--borda)}
  .c-resp{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.62rem;font-weight:700;color:#fff;flex-shrink:0}
  .c-resp.dm{background:var(--navy)} .c-resp.sara{background:#7A4CA0} .c-resp.fono{background:#2E8B62}
  .c-resp-nm{font-size:.72rem;color:var(--mute)}
  .c-valor{margin-left:auto;font-size:.82rem;font-weight:700;color:var(--navy);font-family:ui-monospace,Menlo,monospace}

  .col-empty{margin:8px 6px;padding:22px 12px;text-align:center;border:1.5px dashed var(--borda-2);border-radius:12px;color:var(--mute);font-size:.78rem;line-height:1.4}

  /* ---------- principle footer ---------- */
  .principle{position:fixed;bottom:14px;right:24px;background:var(--branco);border:1px solid var(--borda);border-radius:11px;padding:8px 15px;font-size:.72rem;color:var(--mute);box-shadow:var(--sombra-sm);z-index:20}
  .principle .k{color:var(--laranja);font-weight:600}
  .principle .v{color:var(--navy);font-weight:600}
  .principle .e{color:var(--azul);font-weight:600}

  ::-webkit-scrollbar{width:8px;height:9px}
  ::-webkit-scrollbar-thumb{background:#e6ddd0;border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="mk">👂</span><span class="nm serif">me <b>escuta</b></span></div>
    <nav class="nav">
      <a href="#" class="on">Funil</a>
      <a href="#">Conversas</a>
      <a href="#">Pacientes</a>
      <a href="#">Atividade</a>
    </nav>
    <div class="sp"></div>
    <div class="userchip"><div class="ui"><div class="n">Diogo Tambasco</div><div class="r">produto · tech</div></div><div class="ua">DT</div></div>
  </div>

  <div class="tools">
    <div>
      <h1>Funil de vendas</h1>
      <div class="sub">42 leads ativos · R$ 189.400 em negociação</div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="busca" placeholder="Buscar lead, telefone…">
    </div>
    <button class="filtro"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros</button>
    <div class="sp"></div>
    <button class="btn-novo"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Novo lead</button>
  </div>

  <div class="board" id="board"></div>
</div>

<div class="principle">Todo agente <span class="k">propõe</span>; um humano nomeado <span class="v">valida</span>; só então vira <span class="e">evento</span>.</div>

<script>
(function(){
  // ============ dados mockados (o back real virá de v_estado_lead) ============
  const COLS=[
    {id:'novo',   nome:'Novo lead',        cor:'#a3a0a8'},
    {id:'qualif', nome:'Qualificação',     cor:'#EC662E'},
    {id:'agend',  nome:'Teleconsulta agendada', cor:'#143691'},
    {id:'consulta',nome:'Consulta realizada',   cor:'#7A4CA0'},
    {id:'proposta',nome:'Proposta enviada', cor:'#B8860B'},
    {id:'credito',nome:'Análise de crédito', cor:'#2E8B62'},
    {id:'fechado',nome:'Venda fechada',     cor:'#2E8B62'}
  ];
  const ORIG={wa:'WhatsApp',ig:'Instagram',meta:'Meta Ads',ind:'Indicação'};
  // resp: dm=Diogo ME, sara=Sara (transbordo), fono=Fono
  const CARDS=[
    // novo
    {id:1, nome:'Maria Aparecida Souza', idade:68, tel:'(31) 98812-4471', orig:'wa',  dias:0, resp:'sara', respNm:'Sara', valor:'—',    col:'novo'},
    {id:2, nome:'João Batista Neves',    idade:72, tel:'(21) 99145-0087', orig:'meta',dias:1, resp:'sara', respNm:'Sara', valor:'—',    col:'novo'},
    {id:3, nome:'Célia Ramos',           idade:64, tel:'(31) 98330-7712', orig:'ig',  dias:0, resp:'sara', respNm:'Sara', valor:'—',    col:'novo'},
    {id:4, nome:'Antônio Carlos Lima',   idade:70, tel:'(11) 97701-3390', orig:'wa',  dias:2, resp:'sara', respNm:'Sara', valor:'—',    col:'novo'},
    // qualif (Clara)
    {id:5, nome:'Terezinha de Jesus',    idade:75, tel:'(31) 99622-1180', orig:'wa',  dias:1, resp:'sara', respNm:'Clara→Sara', valor:'R$ 8.900', col:'qualif',
      prop:{ag:'clara',txt:'avançar p/ <b>agendar teleconsulta</b> — lead qualificado'}},
    {id:6, nome:'Sebastião Ferreira',    idade:69, tel:'(31) 98014-5567', orig:'ind', dias:3, resp:'sara', respNm:'Sara', valor:'R$ 6.400', col:'qualif'},
    {id:7, nome:'Neusa Martins',         idade:66, tel:'(48) 99187-2245', orig:'wa',  dias:5, resp:'sara', respNm:'Sara', valor:'R$ 9.800', col:'qualif'},
    {id:8, nome:'Raimundo Nonato',       idade:71, tel:'(85) 98450-1123', orig:'meta',dias:1, resp:'sara', respNm:'Sara', valor:'R$ 7.200', col:'qualif'},
    // agend
    {id:9, nome:'Vera Lúcia Andrade',    idade:63, tel:'(31) 99771-6690', orig:'wa',  dias:1, resp:'fono', respNm:'Fono Ana', valor:'R$ 8.900', col:'agend'},
    {id:10,nome:'Geraldo Magela',        idade:74, tel:'(31) 98220-4418', orig:'ind', dias:2, resp:'fono', respNm:'Fono Ana', valor:'R$ 11.400', col:'agend'},
    {id:11,nome:'Marlene Costa',         idade:67, tel:'(62) 99630-8871', orig:'wa',  dias:4, resp:'fono', respNm:'Fono Léo', valor:'R$ 8.900', col:'agend'},
    // consulta
    {id:12,nome:'Osvaldo Pereira',       idade:70, tel:'(31) 98115-2203', orig:'wa',  dias:1, resp:'fono', respNm:'Fono Ana', valor:'R$ 12.800', col:'consulta'},
    {id:13,nome:'Iracema Nunes',         idade:65, tel:'(11) 97330-9902', orig:'meta',dias:2, resp:'fono', respNm:'Fono Léo', valor:'R$ 9.800', col:'consulta'},
    // proposta
    {id:14,nome:'Djalma Rodrigues',      idade:73, tel:'(31) 99440-1187', orig:'wa',  dias:2, resp:'dm',   respNm:'Diogo ME', valor:'R$ 11.400', col:'proposta'},
    {id:15,nome:'Conceição Alves',       idade:68, tel:'(71) 98620-4410', orig:'ind', dias:6, resp:'dm',   respNm:'Diogo ME', valor:'R$ 8.900', col:'proposta'},
    {id:16,nome:'Waldir Santos',         idade:69, tel:'(31) 98770-3325', orig:'wa',  dias:3, resp:'dm',   respNm:'Diogo ME', valor:'R$ 13.600', col:'proposta'},
    // credito (Levindo)
    {id:17,nome:'Aparecida Gomes',       idade:66, tel:'(31) 99012-7788', orig:'wa',  dias:1, resp:'dm',   respNm:'Diogo ME', valor:'R$ 9.800', col:'credito',
      prop:{ag:'lev',txt:'faixa <b>B</b> — aprovar <b>boleto 12×</b> com entrada'}},
    {id:18,nome:'Benedito Farias',       idade:72, tel:'(27) 98330-5561', orig:'meta',dias:2, resp:'dm',   respNm:'Diogo ME', valor:'R$ 11.400', col:'credito',
      prop:{ag:'lev',txt:'faixa <b>D</b> — recomenda <b>Pix à vista</b> (risco alto)'}},
    // fechado
    {id:19,nome:'Lourdes Bittencourt',   idade:70, tel:'(31) 99880-2214', orig:'wa',  dias:0, resp:'dm',   respNm:'Diogo ME', valor:'R$ 12.800', col:'fechado'},
    {id:20,nome:'Hélio Vasconcelos',     idade:67, tel:'(85) 98110-6643', orig:'ind', dias:1, resp:'dm',   respNm:'Diogo ME', valor:'R$ 9.800', col:'fechado'}
  ];

  // ============ helpers ============
  function clock(){return '<svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 1.5"/></svg>';}
  function phone(){return '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.8 2z"/></svg>';}
  function tempoClasse(d){return d<=2?'ok':(d<=4?'warn':'late');}
  function tempoTxt(d){return d===0?'entrou hoje':(d===1?'1 dia na etapa':d+' dias na etapa');}
  function initials(nm){const p=nm.trim().split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}

  function cardHTML(c){
    const col=COLS.find(x=>x.id===c.col);
    const prop=c.prop?`<div class="prop-pill"><span class="pi ${c.prop.ag}">${c.prop.ag==='clara'?'C':'L'}</span><div><span class="agente">${c.prop.ag==='clara'?'Clara':'Levindo'}</span> propõe: ${c.prop.txt} · <b>valide</b></div></div>`:'';
    const valor=c.valor==='—'?'<span style="color:var(--mute);font-weight:500">sem valor</span>':c.valor;
    return `<div class="card" draggable="true" data-id="${c.id}">
      <div class="stripe" style="background:${col.cor}"></div>
      <div class="c-top">
        <div class="c-nome">${c.nome}<span class="c-idade"> · ${c.idade}a</span></div>
        <span class="c-menu"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>
      </div>
      <div class="c-row">${phone()}${c.tel}</div>
      <div class="c-badges">
        <span class="origem ${c.orig}"><span class="oi"></span>${ORIG[c.orig]}</span>
        <span class="timer ${tempoClasse(c.dias)}">${clock()}${tempoTxt(c.dias)}</span>
      </div>
      ${prop}
      <div class="c-foot">
        <span class="c-resp ${c.resp}">${c.resp==='fono'?'F':initials(c.respNm.replace('→',' '))}</span>
        <span class="c-resp-nm">${c.respNm}</span>
        <span class="c-valor">${valor}</span>
      </div>
    </div>`;
  }

  function brl(v){return v.toLocaleString('pt-BR');}
  function render(){
    const board=document.getElementById('board');
    board.innerHTML=COLS.map(col=>{
      const cds=CARDS.filter(c=>c.col===col.id);
      const total=cds.reduce((s,c)=>{const n=parseInt((c.valor||'').replace(/\D/g,''))||0;return s+n;},0);
      const body=cds.length?cds.map(cardHTML).join(''):`<div class="col-empty">Nenhum lead nesta etapa</div>`;
      return `<div class="col" data-col="${col.id}">
        <div class="col-head">
          <span class="dot" style="background:${col.cor}"></span>
          <span class="ct">${col.nome}</span>
          <span class="cn">${cds.length}</span>
          <span class="cv">${total?'R$ '+brl(total):''}</span>
          <span class="add"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        </div>
        <div class="col-body" data-col="${col.id}">${body}</div>
      </div>`;
    }).join('');
    wireDnD();
  }

  // ============ drag & drop (HTML5 nativo) ============
  let dragEl=null, dragId=null;
  function wireDnD(){
    document.querySelectorAll('.card').forEach(card=>{
      card.addEventListener('dragstart',e=>{dragEl=card;dragId=+card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      card.addEventListener('dragend',()=>{card.classList.remove('dragging');document.querySelectorAll('.col-body.drop').forEach(b=>b.classList.remove('drop'));dragEl=null;});
    });
    document.querySelectorAll('.col-body').forEach(body=>{
      body.addEventListener('dragover',e=>{e.preventDefault();body.classList.add('drop');const after=afterEl(body,e.clientY);if(dragEl){if(after==null)body.appendChild(dragEl);else body.insertBefore(dragEl,after);}});
      body.addEventListener('dragleave',e=>{if(!body.contains(e.relatedTarget))body.classList.remove('drop');});
      body.addEventListener('drop',e=>{e.preventDefault();body.classList.remove('drop');const novaCol=body.dataset.col;const c=CARDS.find(x=>x.id===dragId);if(c&&c.col!==novaCol){c.col=novaCol;c.dias=0;}render();});
    });
  }
  function afterEl(body,y){
    const els=[...body.querySelectorAll('.card:not(.dragging)')];
    return els.reduce((closest,child)=>{
      const box=child.getBoundingClientRect();const offset=y-box.top-box.height/2;
      if(offset<0&&offset>closest.offset)return{offset:offset,el:child};return closest;
    },{offset:-Infinity,el:null}).el;
  }

  // ============ busca ============
  document.getElementById('busca').addEventListener('input',e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll('.card').forEach(card=>{
      const c=CARDS.find(x=>x.id===+card.dataset.id);
      const hit=!q||c.nome.toLowerCase().includes(q)||c.tel.includes(q);
      card.style.display=hit?'':'none';
    });
  });

  render();
})();
</script>
</body>
</html>
